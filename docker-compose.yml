services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkcheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: linkcheck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "linkcheck"]
      interval: 2s
      retries: 15

  migrate:
    image: ghcr.io/justink33/conduit:v0.5.0
    command: migrate
    environment:
      CONDUIT_POSTGRES_DSN: postgres://linkcheck:${POSTGRES_PASSWORD}@postgres:5432/linkcheck?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  conduit:
    image: ghcr.io/justink33/conduit:v0.5.0
    environment:
      CONDUIT_POSTGRES_DSN: postgres://linkcheck:${POSTGRES_PASSWORD}@postgres:5432/linkcheck?sslmode=disable
      CONDUIT_API_KEYS: ${CONDUIT_API_KEY:?set it in .env}
      # links are checked by worker.py, so keep the built in pool off that queue
      CONDUIT_WORKER_QUEUES: default
    ports:
      - "${CONDUIT_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
