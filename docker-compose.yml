name: rotwatch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rotwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: rotwatch
    ports:
      # api.py and worker.py keep the monitor tables in this database,
      # bound to localhost so nothing else on the network can reach it
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rotwatch"]
      interval: 2s
      retries: 15

  migrate:
    image: ghcr.io/justink33/conduit:v0.5.0
    command: migrate
    environment:
      CONDUIT_POSTGRES_DSN: postgres://rotwatch:${POSTGRES_PASSWORD}@postgres:5432/rotwatch?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  conduit:
    image: ghcr.io/justink33/conduit:v0.5.0
    environment:
      CONDUIT_POSTGRES_DSN: postgres://rotwatch:${POSTGRES_PASSWORD}@postgres:5432/rotwatch?sslmode=disable
      CONDUIT_API_KEYS: ${CONDUIT_API_KEY:?set it in .env}
      # crawls and checks run in worker.py on queue monitor, the built in pool
      # only sends the alert webhooks on queue default
      CONDUIT_WORKER_QUEUES: default
      # local lab only: lets alert webhooks reach a receiver on your machine
      CONDUIT_WEBHOOK_ALLOW_PRIVATE_NETWORKS: "true"
    extra_hosts:
      # Docker Desktop has this name already, Linux needs it spelled out
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CONDUIT_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
